name: 🐛 Bug Report
description: Report a bug or wrong data (broken thumbnail, wrong genre, web app issue, etc.)
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! This broke unemployed dev will check when caffeine kicks in :))
        For things that aren't bugs: a missing game or a wrong genre goes in
        [Discussions › Ideas](https://github.com/poli0981/free-steam-games-list/discussions/categories/ideas),
        a game that should go uses **Delete game**, and something you can't use with a keyboard,
        a screen reader or zoom has its own **Accessibility barrier** form.

  - type: dropdown
    id: surface
    attributes:
      label: Where did you see it?
      description: Helps me figure out which layer to look at first.
      options:
        - "Web app — https://free-steam-games.win/"
        - "Desktop app (Windows / macOS / Linux)"
        - "Android app"
        - "Top online — games/top-online.md"
        - "Top offline — games/top-offline.md"
        - "Raw data — data/data_*.jsonl"
        - "API / direct fetch"
        - "Other (describe below)"
    validations:
      required: true

  - type: checkboxes
    id: bug-type
    attributes:
      label: What kind of bug?
      description: Check all that apply (multiple OK).
      options:
        - label: Wrong game name / genre / metadata
        - label: Broken or dead link
        - label: Thumbnail not showing
        - label: Reviews / players not updating
        - label: Wrong game count / total
        - label: Table / chart layout broken
        - label: Service worker / offline cache issue
        - label: Dropdown / form validation issue
        - label: Mobile-specific
        - label: Other (describe below)

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: |
        What happened? Which game(s) or page(s)? How many records affected?
        If it's a web-app bug, include the page address (e.g.
        `https://free-steam-games.win/games/730` or `/charts/anti-cheat`).
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can I see the bug? Numbered list works great.
      placeholder: |
        1. Open /games
        2. Filter genre = FPS
        3. Click the row "Counter-Strike 2"
        4. The game page shows no player count

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / links
      description: |
        Paste image URLs (drag-drop into this field works) or links to the
        affected commit / row / chart. The web app has a page per game —
        `https://free-steam-games.win/games/{appid}`.

  - type: input
    id: env-browser
    attributes:
      label: Browser & OS (for web app bugs)
      description: e.g. Chrome 142 on Windows 11, Safari 17.4 on iPad, Firefox 134 on Ubuntu.
      placeholder: Chrome 142 on Windows 11

  - type: input
    id: env-version
    attributes:
      label: App version (web, desktop or Android)
      description: Shown as "Steam · v…" under the F2P Tracker title in the sidebar (in the menu on small screens).
      placeholder: v2.5.0

  - type: textarea
    id: console
    attributes:
      label: Console / network errors (optional)
      description: |
        DevTools → Console for JS errors, Network for failed requests. Paste
        full stack traces. PII-safe; no PATs / secrets please.
      render: text

  - type: checkboxes
    id: priority
    attributes:
      label: Priority level (choose one)
      options:
        - label: Not urgent (nice to have)
        - label: Could be useful
        - label: Very needed
        - label: Urgent — blocking real use
    validations:
      required: true

  - type: checkboxes
    id: terms
    attributes:
      label: Final check
      description: I understand off-topic / spam will be ignored by default. Good luck :))
      options:
        - label: I agree — this is a real bug report
          required: true
