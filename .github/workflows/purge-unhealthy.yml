name : Purge Unhealthy Games

# Takes out the games that left the store, stopped being free or are not out
# yet - only when two of Steam's answers agree: IStoreBrowseService/GetItems
# screens the whole catalogue in a hundred-odd requests, and appdetails
# confirms each game it flags (scripts/purge_unhealthy.py has the rules and
# the guards). A few minutes, so it runs daily. It replaces both the old
# purge (appdetails for every game, 5.3 hours) and Check Dead Links, a 5.5-hour
# HEAD sweep that never found anything: Steam sends a delisted app's page to
# the store front, which answers 200.

on :
  schedule : [ { cron : '0 7 * * *' } ]
  workflow_dispatch :
    inputs :
      dry_run :
        description : 'Dry run: screen and confirm, remove nothing'
        type : boolean
        default : false
permissions : { contents : write }
# queue: max - a run that finds another data job running waits its turn
# (first in, first out) instead of evicting the run already waiting.
concurrency :
  group : data-write
  cancel-in-progress : false
  queue : max
jobs :
  purge :
    runs-on : ubuntu-latest
    timeout-minutes : 60
    steps :
      -
        uses : actions/checkout@v6
        # main as it is when the job STARTS: a run that waited its turn must
        # work on what the job before it committed.
        with : { ref : main }
      -
        uses : actions/setup-python@v6
        with : { python-version : '3.15' }
      -
        run : chmod +x ./bash/purge.sh && ./bash/purge.sh
        env :
          STEAM_API_KEY : '${{ secrets.STEAM_API_KEY }}'
          JOB_BUDGET_MINUTES : '40'
          PURGE_DRY_RUN : ${{ inputs.dry_run }}
