name: Qodana (JS/TS)

# JetBrains Qodana for JS (an Ultimate linter) over web/: the SvelteKit site,
# the admin SPA, the Cloudflare Worker, the shared modules and the build code.
# It reports to its own Qodana Cloud project, whose project token is the
# repository secret QODANA_TOKEN_TS_JS. The pipeline is qodana-python.yml, the
# Tauri shell under web/src-tauri/ is qodana-rust.yml; what each scan reads and
# ignores is the qodana.yaml in its project directory.
#
# Native mode (web/qodana.yaml, `withinDocker: false`): the analysis runs on
# this runner, with the Node every other workflow uses and node_modules
# installed exactly as web-ci.yml installs it. The Qodana image brings an
# older Node, and would have to install the packages itself.

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '!web/src-tauri/**'
      - '.github/workflows/qodana-js.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'web/**'
      - '!web/src-tauri/**'
      - '.github/workflows/qodana-js.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: qodana-js-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Pull requests from forks and from Dependabot get no repository secrets,
  # and an Ultimate linter will not run without the token, so the scan is
  # skipped rather than failing every such pull request (as sonarcloud.yml).
  token:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - name: Check for the token
        id: check
        env:
          HAS_TOKEN: ${{ secrets.QODANA_TOKEN_TS_JS != '' }}
        run: |
          echo "present=$HAS_TOKEN" >> "$GITHUB_OUTPUT"
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::notice::QODANA_TOKEN_TS_JS is not available to this run; skipping the Qodana scan."
          fi

  scan:
    needs: token
    if: needs.token.outputs.present == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      checks: write         # annotations on the commit
      pull-requests: write  # the summary comment on a pull request
    steps:
      # The pull request's own head commit, not the merge GitHub makes, so the
      # report and its annotations name commits that exist; full history, as
      # Qodana Cloud's setup snippet has it.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      # --ignore-scripts, as everywhere this repo runs `npm ci` (web-ci.yml
      # says why).
      - name: Install web/
        working-directory: web
        run: npm ci --ignore-scripts

      # `svelte-kit sync` writes the tsconfig web/tsconfig.json extends and the
      # route types, and the admin build writes worker/generated/, which
      # worker/index.ts imports. Without them the analysis reads the app
      # untyped and the Worker with an unresolved import (sonarcloud.yml does
      # the same before its scan).
      - name: Generate SvelteKit's types and the admin bundle
        working-directory: web
        run: npm run build:admin

      # web/ is the project. The cache keys name the linter: the three Qodana
      # workflows run on the same commits, and the action's default keys would
      # collide. pr-mode false: a pull request is analysed whole, as Qodana
      # Cloud's setup suggests, not only the files it changes.
      - name: Qodana scan
        uses: JetBrains/qodana-action@3e8d76ff0e0241618abd808682f426afe84bab3f # v2026.2.2
        with:
          args: --project-dir web
          pr-mode: false
          upload-result: true
          artifact-name: qodana-js
          primary-cache-key: qodana-2026.2-js-${{ github.ref }}-${{ github.sha }}
          additional-cache-key: qodana-2026.2-js-${{ github.ref }}
          cache-default-branch-only: true
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN_TS_JS }}
          QODANA_ENDPOINT: 'https://qodana.cloud'
