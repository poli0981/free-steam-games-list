name : Ingest from Issue
on :
  issues : { types : [ opened ] }
permissions : { contents : write, issues : write }
concurrency :
  group : data-write
  cancel-in-progress : false
jobs :
  ingest :
    # Title match alone is NOT an authorization check — issues are public, so
    # without the author_association gate any user can write to main.
    if : >-
      contains(github.event.issue.title, '[add-game]')
      && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
                  github.event.issue.author_association)
    runs-on : ubuntu-latest
    steps :
      -
        uses : actions/checkout@v6
      -
        uses : actions/setup-python@v6
        with : { python-version : '3.12' }
      -
        id : queue
        uses : actions/github-script@v7
        with :
          script : |
            const body = context.payload.issue.body || '';
            const m = body.match(/```json\s*([\s\S]*?)\s*```/);
            if (!m) { core.setFailed('No JSON block'); return; }
            const fs = require('fs');
            const path = 'scripts/temp_info.jsonl';

            // APPEND, never overwrite. This file is a shared queue with more
            // than one producer: the Telegram bot appends to it, and the admin
            // Worker appends approved candidates. writeFileSync here silently
            // destroyed every queued entry not yet consumed, leaving no trace
            // beyond a cleared file in the diff.
            //
            // Entries must also be ONE PER LINE. load_jsonl() in
            // scripts/core/data_store.py aborts the whole read on the first
            // json.loads failure and returns only what it had, after which
            // clear_temp() truncates the file - so one pretty-printed block
            // pasted into an issue would eat every line after it.
            const lines = [], appids = [];
            for (const raw of m[1].trim().split(/\r?\n/)) {
              const t = raw.trim();
              if (!t) continue;
              try {
                const obj = JSON.parse(t);
                lines.push(JSON.stringify(obj));
                const link = typeof obj === 'string' ? obj : (obj && obj.link) || '';
                const hit = String(link).match(/\/app\/(\d{1,8})/);
                if (hit) appids.push(hit[1]);
              } catch {
                core.setFailed(
                  'Each line of the json block must be one complete JSON object ' +
                  '(JSONL), not a pretty-printed array. Offending line: ' + t.slice(0, 120)
                );
                return;
              }
            }
            if (!lines.length) { core.setFailed('json block had no entries'); return; }

            const prev = fs.existsSync(path) ? fs.readFileSync(path, 'utf8') : '';
            const sep = prev && !prev.endsWith('\n') ? '\n' : '';
            fs.appendFileSync(path, sep + lines.join('\n') + '\n');
            core.info(`appended ${lines.length} entr(ies) to ${path}`);
            core.setOutput('appids', appids.join(' '));

            // Snapshot which appids the catalogue ALREADY holds. Without this
            // the report step cannot tell "we added it" from "it was already
            // there" - both look identical in the post-run dataset, so a
            // duplicate request would be answered with a confident "Added!".
            let before = '';
            for (const f of fs.readdirSync('data')) {
              if (f.endsWith('.jsonl')) before += fs.readFileSync('data/' + f, 'utf8');
            }
            core.setOutput('already',
              appids.filter(a => before.includes('/app/' + a + '/')).join(' '));
      -
        name : Configure git
        run : |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
      -
        # Commit the QUEUE ENTRY before attempting the ingest, not after.
        #
        # Previously the only commit came after `python scripts/ingest_new.py`,
        # so a transient Steam failure there aborted the job with the appended
        # line living nowhere but the runner's disk — the request vanished with
        # no record and no retry, and the reporting step below never ran to say
        # so. Committing first makes the request durable: if the ingest step
        # then fails, `Ingest New Game Links` picks the entry up on its next
        # scheduled run.
        name : Commit queue entry
        run : |
          git add scripts/temp_info.jsonl
          git diff --staged --quiet && echo "queue unchanged" || \
            git commit -m "queue: ingest request from #${{ github.event.issue.number }}"
          git push
      -
        run : |
          pip install --quiet -r requirements.txt
          python scripts/ingest_new.py
        env : { STEAM_API_KEY : '${{ secrets.STEAM_API_KEY }}' }
      -
        run : |
          git add .
          git diff --staged --quiet && echo "No changes" || (git commit -m "Ingest #${{ github.event.issue.number }}" && git push)
      -
        # always(): the whole point is to report failures, and every earlier
        # step here can fail. Without this the issue was only ever answered on
        # the happy path.
        if : always()
        uses : actions/github-script@v7
        with :
          script : |
            const fs = require('fs');
            const n = context.payload.issue.number;
            const appids = '${{ steps.queue.outputs.appids }}'.split(' ').filter(Boolean);

            // Ask the dataset, not the queue file. The previous check was
            // `temp_info.jsonl === ''`, but clear_temp() empties that file at
            // the end of EVERY ingest_new.py run — including one where all
            // entries were rejected as duplicate, dead, or unreachable. It
            // reported "Game added!" for games that were never added.
            let blob = '';
            for (const f of fs.readdirSync('data')) {
              if (f.endsWith('.jsonl')) blob += fs.readFileSync('data/' + f, 'utf8');
            }
            const already = '${{ steps.queue.outputs.already }}'.split(' ').filter(Boolean);
            const present = appids.filter(a => blob.includes('/app/' + a + '/'));
            const added = present.filter(a => !already.includes(a));
            const missing = appids.filter(a => !present.includes(a));
            const ok = appids.length > 0 && missing.length === 0;

            const body = ok
              ? [
                  added.length ? `Added ${added.length} game(s): ${added.join(', ')}` : null,
                  already.length ? `Already in the catalogue: ${already.join(', ')}` : null,
                ].filter(Boolean).join('\n')
              : `❌ Not added: ${missing.join(', ') || 'no appid parsed'}\n\n` +
                `The request is committed to \`scripts/temp_info.jsonl\`, so ` +
                `\`Ingest New Game Links\` will retry it on its next scheduled run. ` +
                `If it keeps failing the game is likely a duplicate, delisted, or ` +
                `not free — check this run's logs.`;

            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: n, body,
            });
            await github.rest.issues.update({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: n,
              state: 'closed', labels: ['add-game', ok ? 'completed' : 'rejected'],
            });
