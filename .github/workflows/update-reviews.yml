name : Update Reviews

# Every game's review summary from IStoreBrowseService/GetItems, fifty games a
# request: about two minutes for the whole catalogue (scripts/update_reviews.py
# has the rules). It used to ask appreviews about one game at a time and, at
# 9,800 games, ran into GitHub's six-hour limit with nothing saved.

on :
  schedule : [ { cron : '0 6 * * *' } ]
  workflow_dispatch :
    inputs :
      dry_run :
        description : 'Dry run: read Steam, write nothing'
        type : boolean
        default : false
permissions : { contents : write }
# queue: max - a run that finds another data job running waits its turn
# (first in, first out) instead of evicting the run already waiting.
concurrency :
  group : data-write
  cancel-in-progress : false
  queue : max
jobs :
  reviews :
    runs-on : ubuntu-latest
    timeout-minutes : 60
    steps :
      -
        uses : actions/checkout@v6
        # main as it is when the job STARTS: a run that waited its turn must
        # work on what the job before it committed.
        with : { ref : main }
      -
        uses : actions/setup-python@v6
        with : { python-version : '3.15' }
      -
        run : chmod +x ./bash/reviews.sh && ./bash/reviews.sh
        env :
          JOB_BUDGET_MINUTES : '40'
          REVIEWS_DRY_RUN : ${{ inputs.dry_run }}
