name : Update Reviews
on :
  schedule : [ { cron : '0 6 */2 * *' } ]
  workflow_dispatch :
permissions : { contents : write }
concurrency :
  group : data-write
  cancel-in-progress : false
jobs :
  reviews :
    runs-on : ubuntu-latest
    steps :
      -
        uses : actions/checkout@v6
      -
        uses : actions/setup-python@v6
        with : { python-version : '3.12' }
      -
        run : chmod +x ./bash/reviews.sh && ./bash/reviews.sh
