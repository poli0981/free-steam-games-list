name: Deploy Web (GitHub Pages)

# This no longer deploys the app. The site moved to Cloudflare at
# free-steam-games.win, and the app is built with base "/", so serving it from
# the /free-steam-games-list/ Pages subpath produces a blank page — every asset
# 404s. Rather than leave that live, Pages now serves a redirect.
#
# GitHub Pages cannot return a 301, so the redirect is client-side and
# deliberately carries the #/... fragment across; old links into the app were
# all hash routes.
#
# Once inbound traffic has drained, delete this workflow, delete
# notify-deploy.yml (it listens for this workflow by name), and set
# Settings -> Pages -> Source to None.

on:
  push:
    branches: [main]
    paths:
      - '.github/pages-tombstone/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Upload redirect page
        uses: actions/upload-pages-artifact@v5
        with:
          path: .github/pages-tombstone

      - id: deployment
        uses: actions/deploy-pages@v5
