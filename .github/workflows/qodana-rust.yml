name: Qodana (Rust)

# JetBrains Qodana for Rust (an Ultimate linter, Early Access in 2026.2) over
# web/src-tauri/, the Tauri 2 desktop and Android shell. It reports to its own
# Qodana Cloud project, whose project token is the repository secret
# QODANA_TOKEN_RUST. The pipeline is qodana-python.yml, the rest of web/ is
# qodana-js.yml; what each scan reads and ignores is the qodana.yaml in its
# project directory.
#
# Docker mode: Qodana for Rust has no native mode. The CLI mounts the whole
# repository into the container (the project directory is inside it), and the
# image brings its own Rust toolchain.

on:
  push:
    branches: [main]
    paths:
      - 'web/src-tauri/**'
      - '!web/src-tauri/gen/**'
      - '.github/workflows/qodana-rust.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'web/src-tauri/**'
      - '!web/src-tauri/gen/**'
      - '.github/workflows/qodana-rust.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: qodana-rust-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Pull requests from forks and from Dependabot get no repository secrets,
  # and an Ultimate linter will not run without the token, so the scan is
  # skipped rather than failing every such pull request (as sonarcloud.yml).
  token:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - name: Check for the token
        id: check
        env:
          HAS_TOKEN: ${{ secrets.QODANA_TOKEN_RUST != '' }}
        run: |
          echo "present=$HAS_TOKEN" >> "$GITHUB_OUTPUT"
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::notice::QODANA_TOKEN_RUST is not available to this run; skipping the Qodana scan."
          fi

  scan:
    needs: token
    if: needs.token.outputs.present == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      checks: write         # annotations on the commit
      pull-requests: write  # the summary comment on a pull request
    steps:
      # The pull request's own head commit, not the merge GitHub makes, so the
      # report and its annotations name commits that exist; full history, as
      # Qodana Cloud's setup snippet has it.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      # tauri::generate_context!() embeds frontendDist (../dist) when it
      # expands, and fails when the directory is missing. The analysis needs
      # the macro to expand, not the site, so a stand-in page is enough; the
      # real build is the release workflows'.
      - name: Stand in for the frontend build
        run: |
          mkdir -p web/dist
          printf '<!doctype html>\n<title>F2P Tracker</title>\n' > web/dist/index.html

      # web/src-tauri/ is the project: its Cargo.toml is the crate. The cache
      # keys name the linter: the three Qodana workflows run on the same
      # commits, and the action's default keys would collide. pr-mode false: a
      # pull request is analysed whole, as Qodana Cloud's setup suggests, not
      # only the files it changes.
      - name: Qodana scan
        uses: JetBrains/qodana-action@3e8d76ff0e0241618abd808682f426afe84bab3f # v2026.2.2
        with:
          args: --project-dir web/src-tauri
          pr-mode: false
          upload-result: true
          artifact-name: qodana-rust
          primary-cache-key: qodana-2026.2-rust-${{ github.ref }}-${{ github.sha }}
          additional-cache-key: qodana-2026.2-rust-${{ github.ref }}
          cache-default-branch-only: true
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN_RUST }}
          QODANA_ENDPOINT: 'https://qodana.cloud'
