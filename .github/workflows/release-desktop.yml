name: Release Desktop App

on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name (e.g. desktop-v1.0.0). Created if missing.'
        required: true
        default: 'desktop-v1.0.0'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
          - platform: 'ubuntu-latest'
            args: ''
          - platform: 'windows-latest'
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux build deps
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            build-essential \
            curl \
            wget \
            file

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      # Third-party actions are pinned to a commit, with the version in a
      # comment for Dependabot: a moved tag must not reach a job holding the
      # updater's signing key. rust-toolchain is pinned to a MASTER commit and
      # given its toolchain explicitly - its `stable` branch is regenerated on
      # top of master, so a commit of that branch can disappear.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 (master)
        with:
          toolchain: stable
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: 'web/src-tauri -> target'

      # Plain `npm ci`, as in web-ci.yml. The `|| npm install` fallback is what
      # hid a lockfile conflict for a month: a release must build from exactly
      # the dependencies that were tested, or not at all. No lifecycle scripts
      # (web-ci.yml says why none is needed).
      - name: Install web dependencies
        working-directory: web
        run: npm ci --ignore-scripts

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Inject the updater minisign private key so artefacts are signed
          # at build time. Public key is baked into tauri.conf.json. Set
          # `TAURI_SIGNING_PRIVATE_KEY` (and password if used) under
          # repo Settings → Secrets and variables → Actions. The secret is
          # required: bundle.createUpdaterArtifacts is on, and the updater in
          # every installed copy rejects an artefact its public key cannot
          # verify.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: web
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: 'F2P Tracker ${{ github.event.inputs.tag || github.ref_name }}'
          releaseBody: |
            Desktop builds of the F2P Tracker — a resizable window around the same app as https://free-steam-games.win.

            **Installation**
            - Windows: download the `.msi` or `-setup.exe` and run.
            - macOS: download the `.dmg`, drag to Applications. Universal binary (Intel + Apple Silicon).
            - Linux: `.AppImage` (run directly) or `.deb` (Debian/Ubuntu).

            **Updates**: from 2.0.0 the app checks free-steam-games.win for a newer desktop release a few seconds after launch and offers to install it. The download comes from this Releases page and is verified against the app's minisign key before it installs. Publishing this draft is what makes it visible to that check.

            The app reads its data from free-steam-games.win (`/api/data`) and keeps the last verified copy for offline use. See `docs/DISCLAIMER.md` for accuracy caveats.

            Compiled from commit `${{ github.sha }}`.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}
