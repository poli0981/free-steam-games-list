name: Check Overrides

# Human edits live in data/overrides/<appid>.json and are re-applied by
# save_main() on every write to data/. A malformed or invalid override is
# SKIPPED at apply time rather than raised - deliberately, so one bad file
# cannot abort a two-hour scrape - which means a typo would otherwise fail
# silently and the edit would simply never take effect. This is the check that
# makes that silence loud.

on:
  pull_request:
    paths:
      - 'data/overrides/**'
      - 'scripts/core/overrides.py'
      - 'scripts/edit_game.py'
      # The Worker mirrors validate_value() and the file formatting. This
      # workflow did not trigger on it, so "change one, change the other" had
      # no enforcement in either direction.
      - 'web/worker/routes/edit.ts'
      - 'web/worker/lib/override-doc.ts'
      # The blocklist is the same kind of standing human instruction, with the
      # same two writers (/admin and a CLI) that must produce identical bytes.
      - 'data/blocklist.jsonl'
      - 'scripts/core/blocklist.py'
      - 'scripts/delete_game.py'
      - 'web/shared/removal.ts'
      - 'scripts/tests/fixtures/blocklist_golden.jsonl'
      - '.github/workflows/check-overrides.yml'
  push:
    branches: [main]
    paths:
      - 'data/overrides/**'
      - 'scripts/core/overrides.py'
      - 'scripts/edit_game.py'
      # The Worker mirrors validate_value() and the file formatting. This
      # workflow did not trigger on it, so "change one, change the other" had
      # no enforcement in either direction.
      - 'web/worker/routes/edit.ts'
      - 'web/worker/lib/override-doc.ts'
      # The blocklist is the same kind of standing human instruction, with the
      # same two writers (/admin and a CLI) that must produce identical bytes.
      - 'data/blocklist.jsonl'
      - 'scripts/core/blocklist.py'
      - 'scripts/delete_game.py'
      - 'web/shared/removal.ts'
      - 'scripts/tests/fixtures/blocklist_golden.jsonl'
      - '.github/workflows/check-overrides.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # NOT data-write: this reads the dataset and writes nothing, so queueing it
  # behind the long data jobs would delay the feedback for no reason.
  group: check-overrides-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: |
          pip install --quiet --require-hashes --only-binary :all: -r requirements.txt
      - name: Validate every override
        run: python scripts/edit_game.py --check

      # The other half of the mirror: assert the Worker reproduces the exact
      # bytes Python writes. Round-trips the real committed override files, so
      # a formatting change on either side fails here.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Install web deps
        working-directory: web
        # No lifecycle scripts, as in web-ci.yml (which says why that is safe).
        run: npm ci --ignore-scripts
      - name: Validate the blocklist
        # A line load_blocklist() cannot honour blocks nothing - silently.
        run: python scripts/delete_game.py --check
      # `npm test -- <file>`, never `npx vitest`: npx may fetch a package that
      # is not in the lockfile.
      - name: Assert CLI/Worker override parity
        working-directory: web
        run: npm test -- worker/lib/override-doc.test.ts
      - name: Assert CLI/Worker blocklist parity
        # web-ci only runs for web/**; a Python-only change to the line format
        # must fail somewhere too.
        working-directory: web
        run: npm test -- shared/removal.test.ts
