name: Mark Dead Games

on:
  schedule:
    # Mon + Thu 04:30 UTC. Runs after Sun/Wed top-online refreshes player
    # counts, so current_players is at most ~24h old when we read it.
    - cron: '30 4 * * 1,4'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no write)'
        type: boolean
        default: false
      days:
        description: 'Threshold in days (default 14)'
        default: '14'

permissions:
  contents: write
  actions: write

# queue: max - a run that finds another data job running waits its turn
# (first in, first out) instead of evicting the run already waiting.
concurrency:
  group: data-write
  cancel-in-progress: false
  queue: max

jobs:
  mark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        # The tip of main when the job starts, not when it was queued: a run
        # that waited behind a long data job would otherwise rewrite stale shards.
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.15'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - run: |
          pip install --require-hashes --only-binary :all: -r requirements.txt

      - name: Mark dead games
        env:
          DEAD_GAME_DAYS: ${{ inputs.days || '14' }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python scripts/mark_dead_games.py --dry-run
          else
            python scripts/mark_dead_games.py
          fi

      - name: Commit changes
        if: ${{ inputs.dry_run != true }}
        # Through commit_push.sh like every other data job: it rebases and
        # retries when main moved during the run (a bare `git push` threw the
        # run away), and it commits the whole tree, so scripts/removed_games.jsonl
        # goes with the shards when save_main() applied a removal
        # (scripts/core/blocklist.py).
        run: |
          bash ./bash/commit_push.sh "chore(data): mark dead games"
