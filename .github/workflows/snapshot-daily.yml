name: Daily Snapshot
on:
  schedule: [{cron: '0 23 * * *'}]
  workflow_dispatch:
permissions: {contents: write}
# Shares the data-write group with every other workflow that commits to
# data/ — without it this can push mid-run against a 2-hour job.
concurrency:
  group: data-write
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: chmod +x ./bash/snapshot.sh && ./bash/snapshot.sh
