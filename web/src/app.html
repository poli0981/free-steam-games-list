<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="author" content="poli0981" />

    <!--
      Everything page-specific — title, description, canonical, Open Graph,
      JSON-LD — is set per route with <svelte:head>, not here. The React app put
      one hardcoded set in index.html, which meant every route shared /'s title
      and description, and the "3,400+" in them went stale on its own.
    -->
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover" class="bg-background text-foreground antialiased">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
