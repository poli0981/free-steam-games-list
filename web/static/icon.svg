<!--
  The master mark. Everything else (favicon.svg, the PNG PWA icons, the social
  card) is generated from this by scripts/gen-icons.mjs - do not hand-edit the
  outputs.

  Three ascending bars, not a play triangle: the site is a TRACKER, and a play
  glyph says "video player" to everyone who sees it at 16px. The old icon drew
  a "▶" as a <text> element in font-family="system-ui", which is why it
  rendered as a different shape on every platform and as a tofu box where no
  font supplied that glyph. This is pure geometry and renders identically
  everywhere.

  Maskable-safe: the artwork spans x 128-384 and y 144-368, so its furthest
  point is 170px from the centre - inside the 205px (40%) safe radius that
  Android's maskable mask can crop to.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Steam F2P Tracker">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1C1815" />
      <stop offset="1" stop-color="#100E0C" />
    </linearGradient>
  </defs>

  <!-- Warm near-black: the dark theme's background token, hsl(30 14% 7%). -->
  <rect width="512" height="512" rx="112" fill="url(#ground)" />

  <!-- Ascending bars in the primary amber (34 96% 58%), stepped in opacity so
       the three tones harmonise without three hand-picked hex values. -->
  <g fill="#FBA22D">
    <rect x="128" y="272" width="64" height="96"  rx="18" opacity="0.42" />
    <rect x="224" y="208" width="64" height="160" rx="18" opacity="0.68" />
    <rect x="320" y="144" width="64" height="224" rx="18" />
  </g>

  <!-- Baseline: grounds the bars so they read as a chart rather than as three
       floating pills. -->
  <rect x="128" y="384" width="256" height="14" rx="7" fill="#FBA22D" opacity="0.28" />
</svg>
