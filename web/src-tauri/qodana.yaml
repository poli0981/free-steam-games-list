# Qodana for Rust over the Tauri 2 shell (.github/workflows/qodana-rust.yml,
# Qodana Cloud project token QODANA_TOKEN_RUST). Early Access in 2026.2, and
# Docker only: the image brings its own Rust toolchain.
version: "1.0"
linter: qodana-rust
profile:
  name: qodana.recommended
  inspections:
    - group: ALL
      ignore:
        # Generated by `tauri android init`, and Kotlin/Gradle, not Rust.
        - "gen"
        # Cargo's build output.
        - "target"
